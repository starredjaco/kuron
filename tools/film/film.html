<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kuron film</title>
<link rel="stylesheet" href="face.css">
<style>
/* A 1920×1080 film of a recorded kuron run: captions on top, the system's screens below. */
:root{--bg:#0f1116;--panel:#171a21;--ink:#eef0f5;--ink-2:#aab0c0;--ink-3:#767c8d;--line:#2a2e39;--accent:#7c9cff;--ff:#f2c14e;--code:#58c48b;--model:#7c9cff;--service:#e2a84d;--notyet:#ff7b6e;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font:22px/1.45 var(--sans)}
.cap{position:absolute;left:0;right:0;top:0;height:190px;padding:26px 56px;display:grid;grid-template-columns:1fr auto;gap:8px 32px;align-content:start;border-bottom:1px solid var(--line);background:var(--panel)}
.cap .k{font:600 16px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.cap .say{font-size:34px;font-weight:700;line-height:1.2;grid-column:1}
.cap .sub{font:20px/1.4 var(--mono);color:var(--ink-2);grid-column:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cap .side{grid-column:2;grid-row:1/4;align-self:center;text-align:right;display:grid;gap:6px;justify-items:end}
.brand{font:700 26px var(--mono);letter-spacing:.04em}
.ff{display:inline-flex;gap:10px;align-items:center;border:2px solid var(--ff);color:var(--ff);border-radius:999px;padding:4px 16px;font:700 20px var(--mono)}
.ff[hidden]{display:none}
.real{font:16px var(--mono);color:var(--ink-3)}
.stagewrap{position:absolute;left:0;right:0;top:190px;bottom:0;overflow:hidden;padding:26px 40px}
#stage{transform-origin:top left}
.reply{position:absolute;left:56px;right:56px;bottom:34px;background:var(--ink);color:var(--bg);border-radius:14px;padding:18px 26px;font-size:26px;line-height:1.4;box-shadow:0 16px 40px rgba(0,0,0,.5);transition:opacity .3s}
.reply b{font:700 15px var(--mono);letter-spacing:.1em;text-transform:uppercase;display:block;color:#5b6170;margin-bottom:4px}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,16,.92);z-index:20;padding:60px}
.over[hidden],.reply[hidden]{display:none}
.card{text-align:center;display:grid;gap:22px;justify-items:center}
.card h1{font-size:76px;margin:0;letter-spacing:-.02em;line-height:1.1}
.card p{font-size:32px;color:var(--ink-2);margin:0;max-width:30em}
.card .links{font:26px var(--mono);color:var(--accent);display:grid;gap:8px}
.paste{width:1500px;max-height:900px;background:var(--panel);border:2px solid var(--accent);border-radius:18px;padding:28px 34px;display:grid;gap:14px}
.paste .k{font:600 18px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.paste pre{margin:0;font:17px/1.5 var(--mono);white-space:pre-wrap;color:var(--ink);max-height:780px;overflow:hidden}
.setup{width:1300px;display:grid;gap:22px;justify-items:center;text-align:center}
.setup .clock{font:700 96px var(--mono)}
.calls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1300px}
.calls span{font:20px var(--mono);border:1px solid var(--line);border-radius:8px;padding:4px 12px;background:var(--panel)}
.calls span.new{border-color:var(--accent);color:var(--accent)}
.est{width:1600px;background:var(--panel);border:2px solid var(--service);border-radius:18px;padding:26px 34px;display:grid;gap:14px}
.est table{border-collapse:collapse;width:100%;font-size:20px}
.est th,.est td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.est td.num{font-family:var(--mono);white-space:nowrap}
.tag{display:inline-block;font:15px var(--mono);padding:0 8px;border-radius:5px;border:1px solid currentColor;margin-right:6px}
.tag.code{color:var(--code)} .tag.model{color:var(--model)} .tag.service{color:var(--service)} .tag.not_yet{color:var(--notyet)}
.realbox{position:absolute;left:0;right:0;top:190px;bottom:0;display:grid;place-items:center;background:#000;z-index:10}
.realbox video{max-width:100%;max-height:100%;display:block}
.pastebox{position:absolute;right:30px;top:215px;width:860px;max-height:840px;background:rgba(23,26,33,.96);border:2px solid var(--accent);border-radius:16px;padding:20px 24px;z-index:15;display:grid;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.pastebox .k{font:600 16px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.pastebox pre{margin:0;font:13px/1.42 var(--mono);white-space:pre-wrap;color:var(--ink);overflow:hidden}
.reply{z-index:16}
</style>
</head>
<body>
<header class="cap">
  <div class="k" id="k"></div>
  <div class="say" id="say"></div>
  <div class="sub" id="sub"></div>
  <div class="side"><span class="brand">kuron</span><span class="ff" id="ff" hidden></span><span class="real" id="real"></span></div>
</header>
<div class="stagewrap"><div class="kface focus" id="stage"></div></div>
<div class="reply" id="reply" hidden></div>
<div class="over" id="over" hidden></div>
<script src="face.js"></script>
<script src="film.js"></script>
</body>
</html>
